name: Build and push r_finemapping Docker image

on:
  push:
    branches:
      - master
    paths:
      - "docker/r_finemapping/**"
  workflow_dispatch:

env:
  IMAGE_NAME: jweinstk/fine_mapping
  IMAGE_TAG: "4.5.3"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/r_finemapping
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
